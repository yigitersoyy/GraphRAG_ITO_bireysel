[project]
name = "notes-graphrag"
version = "0.1.0"
description = "Notes to Knowledge Graph: GraphRAG + Neo4j + LM Studio"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "neo4j>=5.20",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.scripts]
notes-graphrag = "notes_graphrag.cli:main"

[dependency-groups]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_graphrag"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
exclude = ["ui"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = ["live_lmstudio: needs a running LM Studio", "neo4j: needs a Neo4j instance"]
