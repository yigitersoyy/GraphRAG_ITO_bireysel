# Neo4j + one-shot migration + API + worker. LM Studio is NOT started here.
# It runs on the host; containers reach it via host.docker.internal (see LLM_BASE_URL in .env).
# Set GRAPHRAG_DEMO=1 to run with the deterministic demo providers instead (no LM Studio).
x-app-env: &app-env
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
  NEO4J_USERNAME: neo4j
  NEO4J_DATABASE: neo4j
  GRAPHRAG_DEMO: ${GRAPHRAG_DEMO:-0}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:1234/v1}
  LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
  EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
  ANSWER_MODEL: ${ANSWER_MODEL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_PROFILE: ${EMBEDDING_PROFILE:-qwen3-embedding-0.6b-local-v1}
  PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-120}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-180}
  INFERENCE_SLOT_WAIT_SECONDS: ${INFERENCE_SLOT_WAIT_SECONDS:-30}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD}  # not NEO4J_*: the image treats those as settings
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$HEALTHCHECK_PASSWORD\" 'RETURN 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  migrate:
    build: .
    command: ["migrate"]
    environment: *app-env
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    init: true
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure  # tolerate a database that is still starting
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    init: true  # tini as PID 1: the worker is a child process, so crashes are signals it can receive
    command: ["worker"]
    environment:
      <<: *app-env
      WORKER_POLL_SECONDS: "0.5"
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

volumes:
  neo4j_data:
