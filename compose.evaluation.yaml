# Dedicated EMPTY target. Change the project name for a fresh evaluation volume.
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:${EVAL_BOLT_PORT:-27687}:7687"
      - "127.0.0.1:${EVAL_HTTP_PORT:-27474}:7474"
    volumes:
      - evaluation_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$HEALTHCHECK_PASSWORD\" 'RETURN 1' >/dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 20s
volumes:
  evaluation_data:
