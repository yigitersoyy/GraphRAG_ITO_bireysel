="1.2" stroke-dasharray=""/><text x="339" y="71" font-size="13" fill="#A5A5A3" font-weight="400" text-anchor="start">Not veya varlık ara…</text><text x="502" y="71" font-size="11" fill="#767674" font-weight="400" text-anchor="start">Ctrl K</text><text x="846" y="71" font-size="12" fill="#A5A5A3" font-weight="400" text-anchor="start">Katmanlar</text><text x="973" y="71" font-size="12" fill="#A5A5A3" font-weight="400" text-anchor="start">Sığdır</text><line x1="0" y1="88" x2="1440" y2="88" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" stroke-dasharray=""/><text x="24" y="122" font-size="13" fill="#A5A5A3" font-weight="400" text-anchor="start">‹  Not haritasına dön</text><text x="24" y="153" font-size="14" fill="#EEEEEC" font-weight="500" text-anchor="start">Cevabı destekleyen ilişkiler</text><line x1="232" y1="467" x2="460" y2="467" stroke="#B5B8C0" stroke-opacity="0.65" stroke-width="1.4" stroke-dasharray=""/><line x1="539" y1="467" x2="761" y2="467" stroke="#B5B8C0" stroke-opacity="0.65" stroke-width="1.4" stroke-dasharray=""/><path d="M453 463 L461 467 L453 471 M754 463 L762 467 L754 471" fill="none" stroke="#B5B8C0" stroke-width="1.4"/><circle cx="207" cy="467" r="25" fill="#A683C9" stroke="none" stroke-width="1" opacity="1"/><text x="207" y="520" font-size="16" fill="#EEEEEC" font-weight="500" text-anchor="middle">Ada</text><circle cx="502" cy="467" r="37" fill="#529BD3" stroke="none" stroke-width="1" opacity="1"/><text x="502" y="532" font-size="16" fill="#EEEEEC" font-weight="500" text-anchor="middle">Project Atlas</text><circle cx="798" cy="467" r="29" fill="#D78C4B" stroke="none" stroke-width="1" opacity="1"/><text x="798" y="524" font-size="16" fill="#EEEEEC" font-weight="500" text-anchor="middle">Neo4j</text><text x="349" y="441" font-size="13" fill="#A5A5A3" font-weight="400" text-anchor="middle">üzerinde çalışıyor</text><text x="650" y="441" font-size="13" fill="#A5A5A3" font-weight="400" text-anchor="middle">kullanıyor</text><text x="349" y="494" font-size="12" fill="#459FE5" font-weight="400" text-anchor="middle">[1]</text><text x="650" y="494" font-size="12" fill="#459FE5" font-weight="400" text-anchor="middle">[2]</text><text x="24" y="916" font-size="12" fill="#A5A5A3" font-weight="400" text-anchor="start">Bir ilişkiyi seçerek kaynak metnini aç</text><rect x="1020" y="44" width="420" height="916" rx="0" fill="#202020" stroke="none" opacity="1"/><line x1="1020" y1="44" x2="1020" y2="960" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray=""/><text x="1044" y="71" font-size="13" fill="#EEEEEC" font-weight="500" text-anchor="start">Notlarına sor</text><text x="1412" y="72" font-size="22" fill="#A5A5A3" font-weight="400" text-anchor="end">×</text><line x1="1020" y1="88" x2="1440" y2="88" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" stroke-dasharray=""/><rect x="1044" y="112" width="372" height="100" rx="6" fill="#242424" stroke="#454545" opacity="1"/><text x="1060" y="140" font-size="15" fill="#EEEEEC" font-weight="400" text-anchor="start">Ada’nın çalıştığı proje hangi</text><text x="1060" y="164" font-size="15" fill="#EEEEEC" font-weight="400" text-anchor="start">veritabanını kullanıyor?</text><rect x="1317" y="174" width="83" height="30" rx="5" fill="#459FE5" stroke="none" opacity="1"/><text x="1358.5" y="194" font-size="13" fill="#10222E" font-weight="600" text-anchor="middle">Sor</text><text x="1044" y="254" font-size="13" fill="#A5A5A3" font-weight="400" text-anchor="start">Yanıt</text><text x="1044" y="290" font-size="18" fill="#EEEEEC" font-weight="400" text-anchor="start">Ada’nın çalıştığı Project Atlas,</text><text x="1044" y="318" font-size="18" fill="#EEEEEC" font-weight="400" text-anchor="start">Neo4j kullanıyor.</text><text x="1044" y="349" font-size="13" fill="#459FE5" font-weight="600" text-anchor="start">[1]  [2]</text><line x1="1044" y1="375" x2="1416" y2="375" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" stroke-dasharray=""/><text x="1044" y="413" font-size="14" fill="#EEEEEC" font-weight="600" text-anchor="start">Kaynaklar</text><text x="1044" y="452" font-size="13" fill="#459FE5" font-weight="600" text-anchor="start">1</text><text x="1069" y="452" font-size="14" fill="#EEEEEC" font-weight="500" text-anchor="start">Atlas ekip notu</text><text x="1069" y="478" font-size="14" fill="#A5A5A3" font-weight="400" text-anchor="start">“Ada, Project Atlas üzerinde</text><text x="1069" y="501" font-size="14" fill="#A5A5A3" font-weight="400" text-anchor="start">çalışıyor.”</text><text x="1069" y="533" font-size="12" fill="#459FE5" font-weight="400" text-anchor="start">Kaynağı aç</text><line x1="1044" y1="553" x2="1416" y2="553" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" stroke-dasharray=""/><text x="1044" y="589" font-size="13" fill="#459FE5" font-weight="600" text-anchor="start">2</text><text x="1069" y="589" font-size="14" fill="#EEEEEC" font-weight="500" text-anchor="start">Atlas teknoloji kararı</text><text x="1069" y="617" font-size="14" fill="#A5A5A3" font-weight="400" text-anchor="start">“Project Atlas, Neo4j kullanıyor.”</text><text x="1069" y="649" font-size="12" fill="#459FE5" font-weight="400" text-anchor="start">Kaynağı aç</text><line x1="1044" y1="680" x2="1416" y2="680" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" stroke-dasharray=""/><text x="1044" y="716" font-size="13" fill="#A5A5A3" font-weight="400" text-anchor="start">İki kaynağı birlikte izliyorsun.</text><text x="1044" y="743" font-size="13" fill="#A5A5A3" font-weight="400" text-anchor="start">Soldaki ilişkiler, bu cevabı destekleyen</text><text x="1044" y="765" font-size="13" fill="#A5A5A3" font-weight="400" text-anchor="start">kaynak parçalarına bağlı.</text><rect x="1044" y="899" width="175" height="30" rx="5" fill="#252525" stroke="#3B3B3B" opacity="1"/><text x="1131.5" y="919" font-size="13" fill="#EEEEEC" font-weight="500" text-anchor="middle">Not haritasına dön</text></svg>