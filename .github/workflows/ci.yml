name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        # Throwaway CI database; the password only protects this ephemeral service container.
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      NEO4J_TEST_URI: bolt://127.0.0.1:7687
      NEO4J_TEST_PASSWORD: ci-only-password
      NEO4J_TEST_WIPE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: unit, contract (memory and Neo4j) and Neo4j integration tests
        run: uv run pytest -q
      - name: evaluation harness (demo providers)
        run: uv run python scripts/evaluate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-summary
          path: reports/evaluation/summary.json
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install using the PowerShell setup entry point
        shell: powershell
        run: .\scripts\setup.ps1
      - name: Unit, memory contract and simulator tests
        run: uv run pytest -q --basetemp reports/ci-pytest
      - name: Windows service lifecycle and HTTP smoke
        run: uv run python scripts/verify_runtime.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --group dev
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: uv run python scripts/runtime.py start --mode demo --api-port 18001 --ui-port 18502
      - run: npm run test:e2e
        working-directory: frontend
      - name: Three-run graph performance baseline
        run: npm run benchmark
        working-directory: frontend
        env:
          BENCHMARK_API_URL: http://127.0.0.1:18001
      - run: uv run python scripts/runtime.py stop --mode demo
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification
          path: |
            reports/frontend-e2e/
            reports/ui-benchmark/
