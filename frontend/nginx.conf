server {
    listen 8501;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    access_log off;
    # Docker service addresses can change when only the API is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream "${API_BASE_URL}";

    location = /health/ui { default_type text/plain; return 200 'ok'; }
    # Compatibility for the existing lifecycle/doctor health URL.
    location = /_stcore/health { default_type text/plain; return 200 'ok'; }
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
    location /health/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 15s;
    }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
